# Vocabulary used as Whisper `initial_prompt` to bias transcription toward
# game-relevant words. Especially important for a young child whose
# pronunciation diverges from Whisper's training distribution.
#
# Words are grouped by category for human readability; categories are
# concatenated transparently when building the prompt.
#
# To grow the vocabulary, append words to the relevant section. No code
# changes needed (see CONTENT_GUIDE.md).

